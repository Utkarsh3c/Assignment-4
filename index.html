<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Interactive Singapore Subzones by Age</title>
  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />
  <style>
    body { margin:0; font-family:sans-serif; }
    h1 { text-align:center; margin:8px 0; }
    #controls { text-align:center; margin-bottom:8px; }
    #map { height:600px; }
    .info {
      padding:6px 8px;
      background:white;
      box-shadow:0 0 15px rgba(0,0,0,0.2);
    }
    .legend {
      line-height:18px;
      color:#555;
      background:white;
      padding:6px 8px;
      box-shadow:0 0 15px rgba(0,0,0,0.2);
    }
    .legend i {
      width:18px; height:18px;
      float:left; margin-right:8px;
      opacity:0.7;
    }
  </style>
</head>
<body>
  <h1>Singapore Subzones by Age Bracket</h1>
  <div id="controls">
    Age Bracket:
    <select id="ageBracket"></select>
  </div>
  <div id="map"></div>

  <!-- Leaflet & D3 -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script>
  // 1. Initialize Leaflet map
  const map = L.map('map').setView([1.3521, 103.8198], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  // 2. Load CSV and GeoJSON in parallel
  Promise.all([
    d3.csv('population2024_long.csv'),
    d3.json('MasterPlan2019SubzoneBoundaryNoSeaGEOJSON.geojson')
  ]).then(([csvData, geojson]) => {

    // 2a. Pivot CSV to a lookup: popData[subzone][age] = count
    const popData = {};
    csvData.forEach(d => {
      const sub = d['Planning Area'];
      const age = d.AGE;
      const cnt = +d.Population;
      if (!popData[sub]) popData[sub] = {};
      popData[sub][age] = cnt;
    });

    // 2b. Build age‐bracket dropdown
    const ages = Array.from(new Set(csvData.map(d=>d.AGE))).sort((a,b)=> {
      // custom sort if needed, or leave lexicographic
      return a.localeCompare(b, undefined, {numeric:true});
    });
    const selector = d3.select('#ageBracket');
    ages.forEach(age => {
      selector.append('option').attr('value', age).text(age);
    });

    // 3. Color scale helper
    function getColor(val, breaks) {
      // you can tune these thresholds as you like
      for (let i=breaks.length-1; i>=0; i--) {
        if (val >= breaks[i]) return colorRamp[i];
      }
      return colorRamp[0];
    }

    // simple blue ramp
    const colorRamp = [
      '#eff3ff',
      '#c6dbef',
      '#9ecae1',
      '#6baed6',
      '#4292c6',
      '#2171b5',
      '#084594'
    ];

    // 4. Info control (hover)
    const info = L.control({ position: 'topright' });
    info.onAdd = () => {
      this._div = L.DomUtil.create('div', 'info');
      this.update();
      return this._div;
    };
    info.update = props => {
      this._div.innerHTML = props
        ? `<b>${props.SUBZONE_N}</b><br>Click for details`
        : 'Hover over a subzone';
    };
    info.addTo(map);

    // 5. Legend control
    const legend = L.control({ position: 'bottomright' });
    let breaks = [];
    legend.onAdd = () => {
      this._div = L.DomUtil.create('div','legend');
      this.update();
      return this._div;
    };
    legend.update = () => {
      let html = '<b>Population</b><br>';
      for (let i=0; i<breaks.length; i++) {
        const from = breaks[i];
        const to = breaks[i+1];
        html +=
          `<i style="background:${colorRamp[i]}"></i> ` +
          `${from}${to ? '&ndash;'+to : '+'}<br>`;
      }
      this._div.innerHTML = html;
    };
    legend.addTo(map);

    // 6. Draw the GeoJSON layer
    let geoLayer;
    function style(feature) {
      const name = feature.properties.SUBZONE_N;
      const age  = selector.property('value');
      const val  = (popData[name] && popData[name][age]) || 0;

      // recompute breaks on every update
      const allVals = Object.values(popData).map(d=>d[age]||0);
      const max = d3.max(allVals);
      // create 7 classes
      breaks = d3.range(7).map(i => Math.round((max/7)*i));

      return {
        fillColor: getColor(val, breaks),
        weight: 1,
        color: '#fff',
        fillOpacity: 0.8
      };
    }

    function highlight(e) {
      const layer = e.target;
      layer.setStyle({ weight: 2, color: '#333' });
      layer.bringToFront();
      info.update(layer.feature.properties);
    }
    function resetHighlight(e) {
      geoLayer.resetStyle(e.target);
      info.update();
    }
    function onClick(e) {
      const props = e.target.feature.properties;
      const name  = props.SUBZONE_N;
      const age   = selector.property('value');
      const val   = (popData[name] && popData[name][age])||0;

      // Build a mini-table for all ages
      let tbl = `<b>${name}</b><br><table>`;
      ages.forEach(a => {
        const c = (popData[name]&&popData[name][a])||0;
        tbl += `<tr><td>${a}</td><td style="padding-left:8px">${c.toLocaleString()}</td></tr>`;
      });
      tbl += '</table>';

      L.popup()
        .setLatLng(e.latlng)
        .setContent(tbl)
        .openOn(map);
    }

    function onEachFeature(feature, layer) {
      layer.on({
        mouseover: highlight,
        mouseout:  resetHighlight,
        click:     onClick
      });
    }

    // finally add the layer
    geoLayer = L.geoJson(geojson, {
      style: style,
      onEachFeature: onEachFeature
    }).addTo(map);

    // 7. Wire up the dropdown
    selector.on('change', () => {
      geoLayer.setStyle(style);
      legend.update();
      info.update();
    });

    // trigger initial render
    selector.dispatch('change');
  })
  .catch(err => console.error(err));
  </script>
</body>
</html>
