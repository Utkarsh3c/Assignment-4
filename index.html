<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Singapore Subzones by Age Bracket</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
    }
    #controls {
      text-align: center;
      padding: 10px;
      background: #f9f9f9;
      border-bottom: 1px solid #ddd;
    }
    #map {
      width: 100%;
      height: 600px;
      position: relative;
    }
    svg {
      width: 100%;
      height: 100%;
    }
    .subzone {
      stroke: #fff;
      stroke-width: 1;
      cursor: pointer;
    }
    .tooltip {
      position: absolute;
      background-color: rgba(0,0,0,0.7);
      color: #fff;
      padding: 5px 8px;
      border-radius: 3px;
      pointer-events: none;
      font-size: 14px;
    }
    .legend text {
      font-size: 12px;
      fill: #333;
    }
    .legend .domain {
      display: none;
    }
  </style>
</head>
<body>
  <h1 style="text-align:center;">Singapore Subzones by Age Bracket</h1>

  <!-- ─── FILTER: AGE BRACKET ─────────────────────────────────────────── -->
  <div id="controls">
    <label>
      Age Bracket
      <select id="ageBracket">
        <!-- options populated in JS -->
      </select>
    </label>
  </div>

  <div id="map"></div>
  <div id="tooltip" class="tooltip" style="opacity:0;"></div>

  <script>
  // ─── 1. LOAD DATA ──────────────────────────────────────────────────────
  Promise.all([
    d3.json("MasterPlan2019SubzoneBoundaryNoSeaGEOJSON.geojson"),
    d3.csv("population_by_age.csv")
  ]).then(([geojson, ageRaw]) => {

    // 1.a. Identify all bracket columns (everything except the first)
    const brackets = ageRaw.columns.slice(1);

    // 1.b. Build a long-form array: { subzone, bracket, pop }
    const allData = [];
    ageRaw.forEach(row => {
      const sub = row["Planning Area/Subzone of Residence"];
      brackets.forEach(br => {
        allData.push({
          subzone:    sub,
          bracket:    br,
          pop:        +row[br] || 0
        });
      });
    });

    // ─── 2. SET UP CONTROLS ──────────────────────────────────────────────
    const ageSel = d3.select("#ageBracket");
    brackets.forEach(br => {
      ageSel.append("option").attr("value", br).text(br);
    });

    // ─── 3. SVG & PROJECTION ─────────────────────────────────────────────
    const width = 800, height = 600;
    const svg = d3.select("#map")
      .append("svg")
        .attr("viewBox", [0, 0, width, height]);

    const projection = d3.geoMercator();
    const path       = d3.geoPath().projection(projection);
    projection.fitSize([width, height], geojson);

    // Prepare legend gradient
    const defs = svg.append("defs");
    defs.append("linearGradient")
        .attr("id","legend-gradient")
        .attr("x1","0%").attr("y1","0%")
        .attr("x2","100%").attr("y2","0%");

    // ─── 4. DRAW SUBZONES ────────────────────────────────────────────────
    const tooltip = d3.select("#tooltip");
    let currentPop = {};

    const subzonePaths = svg.selectAll(".subzone")
      .data(geojson.features)
      .join("path")
        .attr("class","subzone")
        .attr("d", path)
        .on("mouseover",(e,d) => {
          const name = d.properties.SubzoneName;
          const p = currentPop[name] || 0;
          tooltip.style("opacity",1)
                 .html(`<strong>${name}</strong><br>Population: ${p}`);
        })
        .on("mousemove", e => {
          tooltip.style("left",  (e.pageX + 10) + "px")
                 .style("top",   (e.pageY + 10) + "px");
        })
        .on("mouseout", () => tooltip.style("opacity",0));

    // Pan & zoom
    const zoom = d3.zoom()
      .scaleExtent([1,8])
      .on("zoom", ({transform}) => {
        subzonePaths.attr("transform", transform);
        svg.select(".legend").attr("transform", transform);
      });
    svg.call(zoom);

    // ─── 5. LEGEND ────────────────────────────────────────────────────────
    const legendG = svg.append("g")
      .attr("class","legend")
      .attr("transform",`translate(${width-220},${height-40})`);
    const legendW = 200, legendH = 10;

    legendG.append("rect")
      .attr("width", legendW)
      .attr("height", legendH)
      .style("fill","url(#legend-gradient)");
    const legendAxisG = legendG.append("g")
      .attr("transform", `translate(0,${legendH})`);

    // ─── 6. UPDATE FUNCTION ─────────────────────────────────────────────
    function updateMap() {
      const chosen = ageSel.property("value");

      // 6.a. Filter & aggregate
      currentPop = {};
      allData
        .filter(d => d.bracket === chosen)
        .forEach(d => {
          currentPop[d.subzone] = (currentPop[d.subzone]||0) + d.pop;
        });

      const pops = Object.values(currentPop);
      const minP = d3.min(pops), maxP = d3.max(pops);

      // 6.b. Color scale + gradient stops
      const color = d3.scaleSequential()
        .domain([minP, maxP])
        .interpolator(d3.interpolateBlues);

      svg.select("#legend-gradient")
        .selectAll("stop")
        .data(d3.ticks(0,1,10))
        .join("stop")
          .attr("offset", d => `${d*100}%`)
          .attr("stop-color", d => color(minP + d*(maxP-minP)));

      // 6.c. Axis
      const x = d3.scaleLinear()
        .domain([minP, maxP])
        .range([0, legendW]);
      const axis = d3.axisBottom(x)
        .ticks(5)
        .tickFormat(d3.format(".2s"));
      legendAxisG.call(axis);

      // 6.d. Recolor map
      subzonePaths
        .transition().duration(300)
        .attr("fill", d => {
          const n = d.properties.SubzoneName;
          const v = currentPop[n] || 0;
          return v ? color(v) : "#ccc";
        });
    }

    // Initial draw + listener
    updateMap();
    ageSel.on("change", updateMap);

  }).catch(err => console.error(err));
  </script>
</body>
</html>
