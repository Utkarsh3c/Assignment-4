<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Singapore Subzones by Age Bracket</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    /* …your existing styles… */
  </style>
</head>
<body>
  <h1 style="text-align:center;">Singapore Subzones by Age Bracket</h1>
  <div id="controls">
    <label>Age Bracket
      <select id="ageBracket"></select>
    </label>
  </div>
  <div id="map"></div>
  <div id="tooltip" class="tooltip" style="opacity:0;"></div>
  <div id="info"><em>Click a subzone for details</em></div>

  <script>
  Promise.all([
    d3.json("MasterPlan2019SubzoneBoundaryNoSeaGEOJSON.geojson"),
    d3.csv("population2024_long.csv")
  ]).then(([geojson, longData]) => {

    // ─── 0. GeoJSON Name Key ─────────────────────────────────────────────
    // Replace if your geojson uses a different property for subzone name
    const NAME_KEY = "SUBZONE_N";

    // ─── 1. Use long‐form CSV directly ────────────────────────────────────
    // Each row already has “Planning Area”, “AGE”, “Population”
    // Build our allData array
    const allData = longData.map(d => ({
      subzone: d["Planning Area"],
      bracket: d.AGE,
      pop:     +d.Population || 0
    }));

    // Derive unique brackets
    const brackets = Array.from(new Set(allData.map(d => d.bracket)));

    // ─── 2. Populate dropdown ────────────────────────────────────────────
    const ageSel = d3.select("#ageBracket");
    brackets.forEach(br => {
      ageSel.append("option")
            .attr("value", br)
            .text(br);
    });

    // ─── 3. Set up SVG & projection ──────────────────────────────────────
    const width = 800, height = 600;
    const svg = d3.select("#map")
      .append("svg")
        .attr("viewBox", [0,0,width,height]);

    const projection = d3.geoMercator()
                        .fitSize([width, height], geojson);
    const path = d3.geoPath().projection(projection);

    // Gradient for legend
    svg.append("defs")
      .append("linearGradient")
        .attr("id","legend-gradient")
        .attr("x1","0%").attr("y1","0%")
        .attr("x2","100%").attr("y2","0%");

    // ─── 4. Draw subzones ────────────────────────────────────────────────
    let currentPop = {};
    const tooltip = d3.select("#tooltip");

    const subzonePaths = svg.selectAll(".subzone")
      .data(geojson.features)
      .join("path")
        .attr("class","subzone")
        .attr("d", path)
        .on("mouseover",(e,d) => {
          const name = d.properties[NAME_KEY];
          const p    = currentPop[name]||0;
          tooltip.style("opacity",1)
                 .html(`<strong>${name}</strong><br/>Population: ${p}`);
        })
        .on("mousemove", e => {
          tooltip.style("left", (e.pageX+10)+"px")
                 .style("top",  (e.pageY+10)+"px");
        })
        .on("mouseout", () => tooltip.style("opacity",0))
        .on("click", (e,d) => {
          subzonePaths.classed("selected", f => f===d);
          showInfo(d.properties[NAME_KEY]);
        });

    svg.call(d3.zoom()
      .scaleExtent([1,8])
      .on("zoom", ({transform}) => {
        subzonePaths.attr("transform", transform);
        svg.select(".legend").attr("transform", transform);
      }));

    // ─── 5. Legend boilerplate ──────────────────────────────────────────
    const legendG = svg.append("g")
      .attr("class","legend")
      .attr("transform",`translate(${width-220},${height-40})`);
    const LEG_W = 200, LEG_H = 10;
    legendG.append("rect")
      .attr("width", LEG_W)
      .attr("height", LEG_H)
      .style("fill","url(#legend-gradient)");
    const legendAxisG = legendG.append("g")
      .attr("transform",`translate(0,${LEG_H})`);

    // ─── 6. updateMap() ─────────────────────────────────────────────────
    function updateMap() {
      const chosen = ageSel.property("value");

      // Aggregate for this bracket
      currentPop = {};
      allData
        .filter(d => d.bracket === chosen)
        .forEach(d => {
          currentPop[d.subzone] = (currentPop[d.subzone]||0) + d.pop;
        });

      // Build color domain
      const pops = Object.values(currentPop);
      const minP = d3.min(pops), maxP = d3.max(pops);
      const color = d3.scaleSequential()
        .domain([minP, maxP])
        .interpolator(d3.interpolateBlues);

      // Update gradient stops
      svg.select("#legend-gradient")
        .selectAll("stop")
        .data(d3.ticks(0,1,10))
        .join("stop")
          .attr("offset", d => `${d*100}%`)
          .attr("stop-color", d => color(minP + d*(maxP-minP)));

      // Update axis
      const x = d3.scaleLinear()
        .domain([minP, maxP])
        .range([0,LEG_W]);
      d3.axisBottom(x)
        .ticks(5)
        .tickFormat(d3.format(".2s"))
        (legendAxisG);

      // Recolor
      subzonePaths.transition().duration(300)
        .attr("fill", d => {
          const name = d.properties[NAME_KEY];
          const v    = currentPop[name]||0;
          return v ? color(v) : "#ccc";
        });
    }

    // ─── 7. showInfo() ──────────────────────────────────────────────────
    function showInfo(subzoneName) {
      // Find all rows in longData == this subzone
      const rows = longData.filter(r => r["Planning Area"] === subzoneName);
      if (!rows.length) {
        d3.select("#info").html(`<p>No data for ${subzoneName}</p>`);
        return;
      }
      // Build HTML table
      let html = `<h3>${subzoneName}</h3>
        <table>
          <thead><tr><th>Age Bracket</th><th>Population</th></tr></thead>
          <tbody>`;
      rows.forEach(r => {
        html += `<tr>
          <td>${r.AGE}</td><td>${+r.Population||0}</td>
        </tr>`;
      });
      html += `</tbody></table>`;
      d3.select("#info").html(html);
    }

    // Initial render & hookups
    updateMap();
    ageSel.on("change", () => {
      updateMap();
      d3.select("#info").html(`<em>Click a subzone for details</em>`);
      subzonePaths.classed("selected", false);
    });

  }).catch(err => console.error(err));
  </script>
</body>
</html>
