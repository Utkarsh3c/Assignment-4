<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Singapore Population Choropleth</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://d3js.org/d3-scale-chromatic.v1.min.js"></script>
  <style>
    body { margin:0; padding:0; display:flex; height:100vh; align-items:center; justify-content:center; background:#fff; position:relative; }
    h1 {
      position:absolute;
      top:10px;
      left:10px;
      margin:0;
      font-family:sans-serif;
      font-size:1.5em;
      font-weight:800;
    }
    h2.sub {
      position:absolute;
      top:36px;
      left:10px;
      margin:0;
      font-family:sans-serif;
      font-size:1em;
      font-weight:400;
      color:#666;
    }
    .filter { position:absolute; top:10px; right:10px; font-family:sans-serif; background:#fff; padding:8px; border:1px solid #ccc; border-radius:4px; }
    .filter label { margin-right:6px; font-weight:600; }
    .filter select { margin-right:12px; font-size:14px; }
    .legend { position:absolute; top:60px; left:10px; font-family:sans-serif; }
    .legend-item { display:flex; align-items:center; margin-bottom:4px; }
    .legend-rect { width:20px; height:10px; margin-right:6px; border:1px solid #999; }
    svg { width:90vw; height:90vh; }
    .tooltip { position:absolute; pointer-events:none; background:#fff; padding:4px 8px; border:1px solid #aaa; border-radius:4px; font-size:12px; box-shadow:0 1px 2px rgba(0,0,0,0.2); opacity:0; transition:opacity 0.1s; }
  </style>
</head>
<body>
  <h1>Singapore population choropleth 2024</h1>
  <h2 class="sub">by Utkarsh Chaudhary | 1009465</h2>
  <div class="filter">
    <label for="ageSelect">Age Group:</label>
    <select id="ageSelect"></select>
    <label for="genderSelect">Gender:</label>
    <select id="genderSelect">
      <option value="Total">Total</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
    </select>
  </div>
  <div class="legend" id="legend"></div>
  <svg viewBox="0 0 1000 600"></svg>
  <div class="tooltip"></div>
  <script>
    const width = 1000, height = 600;
    const svg = d3.select('svg');
    const legend = d3.select('#legend');
    const tooltip = d3.select('.tooltip');

    Promise.all([
      d3.json('sgmap.json'),
      d3.csv('population.csv', d => ({
        Subzone: d.Subzone.trim(),
        PlanningArea: d['Planning Area']?.trim() || '',
        AgeGroup: d['Age Group'].trim(),
        Sex: d['Sex'].trim(),
        Population: +d.Population.replace(/,/g, '') || 0
      }))
    ]).then(([geo, data]) => {
      const ageSelect = d3.select('#ageSelect');
      const ageGroups = Array.from(new Set(data.map(d => d.AgeGroup))).sort();
      ageSelect.append('option').attr('value', 'Total').text('Total');
      ageGroups.forEach(a => ageSelect.append('option').attr('value', a).text(a));

      ageSelect.on('change', () => updateMap());
      d3.select('#genderSelect').on('change', () => updateMap());
      updateMap();

      function updateMap() {
        const selAge = ageSelect.property('value');
        const selSex = d3.select('#genderSelect').property('value');
        const filtered = data.filter(d =>
          (selAge === 'Total' || d.AgeGroup === selAge) &&
          (selSex === 'Total' || d.Sex === selSex)
        );

        const popMap = {}, areaMap = {};
        filtered.forEach(d => {
          const key = d.Subzone.toUpperCase();
          popMap[key] = (popMap[key] || 0) + d.Population;
          areaMap[key] = d.PlanningArea;
        });

        const values = Object.values(popMap);
        const max = d3.max(values) || 0;
        const step = Math.ceil(max / 7) || 1;
        const colors = d3.quantize(d3.interpolateViridis, 7);
        const thresholds = d3.range(step, step * colors.length, step);
        const scale = d3.scaleThreshold().domain(thresholds).range(colors);

        const projection = d3.geoMercator().center([103.851959, 1.290270]).fitSize([width, height], geo);
        const path = d3.geoPath().projection(projection);

        const regions = svg.selectAll('path').data(geo.features);
        regions.enter().append('path').merge(regions)
          .attr('d', path)
          .attr('stroke', '#666').attr('stroke-width', 1)
          .attr('fill', d => {
            const key = (d.properties.Name || '').trim().toUpperCase();
            return popMap[key] != null ? scale(popMap[key]) : '#ccc';
          })
          .attr('fill-opacity', 0.7)
          .on('mouseover', (e, d) => {
            const key = (d.properties.Name || '').trim().toUpperCase();
            const val = popMap[key] || 0;
            const area = areaMap[key] || '—';
            tooltip.style('opacity', 1)
              .html(`<strong>${d.properties.Name}</strong><br/>Area: ${area}<br/>Pop: ${val.toLocaleString()}`);
          })
          .on('mousemove', e => tooltip.style('left', (e.pageX + 10) + 'px').style('top', (e.pageY + 10) + 'px'))
          .on('mouseout', () => tooltip.style('opacity', 0));
        regions.exit().remove();

        legend.selectAll('.legend-item').remove();
        colors.forEach((c, i) => {
          const from = i * step;
          const to = (i + 1) * step;
          const item = legend.append('div').attr('class', 'legend-item');
          item.append('div').attr('class', 'legend-rect').style('background', c);
          item.append('div').text(`${from.toLocaleString()} – ${to.toLocaleString()}`);
        });
      }
    }).catch(console.error);
  </script>
</body>
</html>
