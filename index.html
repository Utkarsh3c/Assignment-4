<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Singapore Subzones Choropleth by Age</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 0;
      }
      #controls {
        text-align: center;
        padding: 10px;
        background: #f9f9f9;
        border-bottom: 1px solid #ddd;
      }
      #map {
        width: 100%;
        height: 600px;
        position: relative;
      }
      svg {
        width: 100%;
        height: 100%;
      }
      .subzone {
        stroke: #fff;
        stroke-width: 1;
        cursor: pointer;
      }
      .tooltip {
        position: absolute;
        background-color: rgba(0,0,0,0.7);
        color: #fff;
        padding: 5px 8px;
        border-radius: 3px;
        pointer-events: none;
        font-size: 14px;
      }
      .legend text {
        font-size: 12px;
        fill: #333;
      }
      .legend .domain {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1 style="text-align:center;">Singapore Subzones Choropleth by Age</h1>

    <div id="controls">
      <label>
        Age Group
        <select id="ageGroup">
          <option value="All">All</option>
        </select>
      </label>
    </div>

    <div id="map"></div>
    <div id="tooltip" class="tooltip" style="opacity:0;"></div>

    <script>
      // click handler stub
      function handleSubzoneClick(name, pop, planningArea) {
        alert(`Subzone: ${name}\nPlanning Area: ${planningArea}\nPopulation: ${pop}`);
      }

      Promise.all([
        d3.json("MasterPlan2019SubzoneBoundaryNoSeaGEOJSON.geojson"),
        d3.csv("population2024.csv")
      ]).then(([geojson, populationRaw]) => {
        // Extract age columns
        const cols = populationRaw.columns || Object.keys(populationRaw[0]);
        const ageCols = cols.filter(c => c !== 'SUBZONE_N' && c !== 'Subzone');

        // Populate age dropdown
        const ageSel = d3.select('#ageGroup');
        ageCols.forEach(age => {
          ageSel.append('option').attr('value', age).text(age);
        });

        // Build population lookup by subzone
        const popRawMap = new Map();
        populationRaw.forEach(r => {
          popRawMap.set(r.Subzone.trim().toLowerCase(), r);
        });

        // Build planning area lookup from GeoJSON Description HTML
        const planningMap = {};
        geojson.features.forEach(f => {
          const key = f.properties.Name.trim().toLowerCase();
          const desc = f.properties.Description;
          const match = /<th>PLN_AREA_N<\/th>\s*<td>(.*?)<\/td>/.exec(desc);
          planningMap[key] = match ? match[1] : 'Unknown';
        });

        // Set up SVG & projection
        const width = 800, height = 600;
        const svg = d3.select('#map').append('svg')
                      .attr('viewBox', [0, 0, width, height]);

        const projection = d3.geoMercator().fitSize([width, height], geojson);
        const path = d3.geoPath().projection(projection);

        // Legend gradient
        const defs = svg.append('defs');
        defs.append('linearGradient')
            .attr('id', 'legend-gradient')
            .attr('x1', '0%').attr('y1', '0%')
            .attr('x2', '100%').attr('y2', '0%');

        // Draw subzones
        let currentPop = {};
        const subzonePaths = svg.selectAll('.subzone')
          .data(geojson.features)
          .join('path')
            .attr('class', 'subzone')
            .attr('d', path)
            .on('mouseover', function(event, d) {
              const name = d.properties.Name.trim();
              const key  = name.toLowerCase();
              const pop  = currentPop[key] || 0;
              const area = planningMap[key] || 'Unknown';

              // highlight
              d3.select(this)
                .attr('stroke', '#000')
                .attr('stroke-width', 3)
                .raise();

              d3.select('#tooltip')
                .style('opacity', 1)
                .html(`<strong>Subzone:</strong> ${name}<br/>` +
                      `<strong>Planning Area:</strong> ${area}<br/>` +
                      `<strong>Population:</strong> ${pop.toLocaleString()}`);
            })
            .on('mousemove', (event) => {
              d3.select('#tooltip')
                .style('left',  (event.pageX + 10) + 'px')
                .style('top',   (event.pageY + 10) + 'px');
            })
            .on('mouseout', function(event, d) {
              d3.select(this)
                .attr('stroke', '#fff')
                .attr('stroke-width', 1);
              d3.select('#tooltip').style('opacity', 0);
            })
            .on('click', function(event, d) {
              const name = d.properties.Name.trim();
              const key  = name.toLowerCase();
              const pop  = currentPop[key] || 0;
              const area = planningMap[key] || 'Unknown';
              handleSubzoneClick(name, pop, area);
            });

        // Enable pan & zoom
        svg.call(d3.zoom().scaleExtent([1,8]).on('zoom', ({transform}) => {
          subzonePaths.attr('transform', transform);
          svg.select('.legend').attr('transform', transform);
        }));

        // Legend axis
        const legendGroup = svg.append('g')
          .attr('class','legend')
          .attr('transform', `translate(${width-220},${height-40})`);
        const legendWidth = 200, legendHeight = 10;
        legendGroup.append('rect')
          .attr('width', legendWidth)
          .attr('height', legendHeight)
          .style('fill', 'url(#legend-gradient)');
        const legendAxisG = legendGroup.append('g')
          .attr('transform', `translate(0,${legendHeight})`);

        // Update choropleth
        function updateChoropleth() {
          const selAge = d3.select('#ageGroup').property('value');
          currentPop = {};

          populationRaw.forEach(r => {
            const key = r.Subzone.trim().toLowerCase();
            let val = 0;
            if (selAge === 'All') {
              ageCols.forEach(col => val += +r[col] || 0);
            } else {
              val = +r[selAge] || 0;
            }
            currentPop[key] = val;
          });

          const pops = Object.values(currentPop);
          const minPop = d3.min(pops);
          const maxPop = d3.max(pops);

          const colorScale = d3.scaleSequential()
            .domain([minPop, maxPop])
            .interpolator(d3.interpolateBlues);

          // update gradient
          svg.select('#legend-gradient')
            .selectAll('stop')
            .data(d3.ticks(0,1,10))
            .join('stop')
              .attr('offset', d => `${d*100}%`)
              .attr('stop-color', d => colorScale(minPop + d*(maxPop-minPop)));

          // update legend axis
          const legendScale = d3.scaleLinear().domain([minPop, maxPop]).range([0, legendWidth]);
          d3.axisBottom(legendScale)
            .ticks(5)
            .tickFormat(d3.format('.2s'))
            (legendAxisG);

          // recolor
          subzonePaths.transition().duration(300)
            .attr('fill', f => {
              const nm = f.properties.Name.trim().toLowerCase();
              const p  = currentPop[nm] || 0;
              return p ? colorScale(p) : '#ccc';
            });
        }

        // initial render & listener
        updateChoropleth();
        d3.select('#ageGroup').on('change', updateChoropleth);

      }).catch(err => console.error('Error loading data:', err));
    </script>
  </body>
</html>
