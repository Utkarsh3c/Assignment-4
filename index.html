<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Singapore Population Choropleth by Age Group</title>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #fff;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .figure {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      margin-top: 20px;
    }
    .legend-col {
      width: 200px;
      margin-right: 20px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }
    .legend-rect {
      width: 20px;
      height: 10px;
      margin-right: 8px;
      border: 1px solid #999;
    }
    svg {
      flex: 1;
      height: auto;
    }
    h1 {
      font-size: 1.5em;
      font-weight: 800;
      margin: 0;
      text-align: center;
    }
    h2.subtitle {
      font-size: 1em;
      font-weight: 400;
      color: #666;
      margin: 4px 0 0;
      text-align: center;
    }
    .tooltip {
      position: absolute;
      pointer-events: none;
      background: white;
      padding: 6px 10px;
      border: 1px solid #aaa;
      border-radius: 4px;
      font-size: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
      opacity: 0;
      transition: opacity 0.1s;
    }
  </style>
</head>
<body>
  <h1>Population change</h1>
  <h2 class="subtitle">Population by age group in Singapore subzones</h2>
  <div class="figure">
    <div class="legend-col" id="legend"></div>
    <svg viewBox="0 0 1000 600"></svg>
  </div>

  <script>
    const width = 1000, height = 600;
    const svg = d3.select("svg");
    const legend = d3.select("#legend");
    const tooltip = d3.select("body").append("div").attr("class","tooltip");

    Promise.all([
      d3.json("MasterPlan2019SubzoneBoundaryNoSeaGEOJSON.geojson"),
      d3.csv("POP.csv", d => ({
        PlanningArea: d['Planning Area'].trim(),
        Subzone: d['Subzone'].trim(),
        AgeGroup: d['Age Group'].trim(),
        Population: d['Population'] === '-' ? 0 : +d['Population'].replace(/,/g, '').trim()
      }))
    ]).then(([geo, data]) => {
      // Filter and map by selected age group
      const defaultGroup = 'Total';
      const ageGroups = Array.from(new Set(data.map(d => d.AgeGroup))).sort();
      const selGroup = ageGroups.includes(defaultGroup) ? defaultGroup : ageGroups[0];
      updateMap(selGroup);

      function updateMap(group) {
        // Filter data rows by age group
        const filtered = data.filter(d => group === defaultGroup || d.AgeGroup === group);

        // Build lookup map for quick join
        const popMap = {};
        filtered.forEach(d => {
          const key = d.Subzone.toUpperCase();
          popMap[key] = (popMap[key] || 0) + d.Population;
        });

        // Determine color scale
        const pops = Object.values(popMap);
        const maxPop = d3.max(pops) || 0;
        const step = Math.ceil(maxPop / 7);
        const colors = d3.schemeBlues[7];
        const thresholds = d3.range(step, step * colors.length, step);
        const colorScale = pops.length ? d3.scaleThreshold().domain(thresholds).range(colors) : () => "#ccc";

        // Projection and path
        const projection = d3.geoMercator()
          .center([103.851959, 1.290270])
          .fitSize([width, height], geo);
        const path = d3.geoPath().projection(projection);

        // Draw or update regions
        const regions = svg.selectAll("path").data(geo.features);
        regions.enter().append("path").merge(regions)
          .attr("d", path)
          .attr("stroke", "#666").attr("stroke-width", 1)
          .attr("fill", d => {
            const key = d.properties.Name.trim().toUpperCase();
            return key in popMap ? colorScale(popMap[key]) : "#ccc";
          })
          .on("mouseover", (event, d) => {
            d3.select(event.currentTarget).raise().attr("stroke", "#333").attr("stroke-width", 2);
            const key = d.properties.Name.trim().toUpperCase();
            const val = popMap[key] || 0;
            tooltip.transition().duration(50).style("opacity", 1);
            tooltip.html(`<strong>${d.properties.Name}</strong><br/>${val.toLocaleString()}`);
          })
          .on("mousemove", event => tooltip.style("left", (event.pageX + 10) + "px").style("top", (event.pageY + 10) + "px"))
          .on("mouseout", (event) => {
            d3.select(event.currentTarget).attr("stroke", "#666").attr("stroke-width", 1);
            tooltip.transition().duration(50).style("opacity", 0);
          });
        regions.exit().remove();

        // Build legend
        legend.selectAll(".legend-item").remove();
        if (pops.length) {
          colors.forEach((c, i) => {
            const from = i * step;
            const to = (i + 1) * step;
            const item = legend.append("div").attr("class", "legend-item");
            item.append("div").attr("class", "legend-rect").style("background", c);
            item.append("div").text(`${from.toLocaleString()} – ${to.toLocaleString()}`);
          });
        }
      }
    }).catch(err => console.error(err));
  </script>
</body>
</html>
