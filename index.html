<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Subzone Population Choropleth</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { margin: 0; }
    #map { width: 100vw; height: 100vh; }
    svg { display: block; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    // 1. SVG setup
    const width  = 960;
    const height = 600;

    const svg = d3.select("#map")
      .append("svg")
        .attr("width",  width)
        .attr("height", height);

    // 2. Load GeoJSON + CSV in parallel
    Promise.all([
      d3.json("MasterPlan2019SubzoneBoundaryNoSeaGEOJSON.geojson"),
      d3.csv("POP.csv", row => ({
        subzone:    row.Subzone.trim(),
        population: row.Population === "-" ? 0 : +row.Population.replace(/,/g, "")
      }))
    ])
    .then(([geoData, popRows]) => {
      // 3. Aggregate total population per subzone
      const popBySubzone = d3.rollup(
        popRows,
        v => d3.sum(v, d => d.population),
        d => d.subzone
      );

      // 4. Attach population to each GeoJSON feature
      geoData.features.forEach(f => {
        // adjust this to match your GeoJSON property name
        const name = f.properties.SUBZONE_N || f.properties.subzone || f.properties.Name;
        f.properties.population = popBySubzone.get(name) || 0;
      });

      // 5. Draw the map
      drawMap(geoData, popBySubzone);
    })
    .catch(err => console.error("Error loading files:", err));

    // 6. Choropleth drawing function
    function drawMap(geoData, popBySubzone) {
      // projection fitting Singapore
      const projection = d3.geoMercator()
        .fitSize([width, height], geoData);

      const path = d3.geoPath().projection(projection);

      // colour scale based on max population
      const maxPop = d3.max(popBySubzone.values());
      const color = d3.scaleSequential([0, maxPop], d3.interpolateOrRd);

      svg.selectAll("path")
        .data(geoData.features)
        .join("path")
          .attr("d", path)
          .attr("fill", d => color(d.properties.population))
          .attr("stroke", "#444")
          .attr("stroke-width", 0.5)
        .append("title")
          .text(d => 
            `${d.properties.SUBZONE_N || d.properties.subzone}: ` +
            `${d.properties.population.toLocaleString()}`
          );
    }

    /* Optional: if subzone name lives inside an HTML "Description" field,
       uncomment and use this parser instead of the direct property above.

    function parseAttributes(htmlString) {
      const doc = new DOMParser()
        .parseFromString(htmlString, "text/html");
      const rows = doc.querySelectorAll("table tr");
      const obj  = {};
      rows.forEach(tr => {
        const key = tr.querySelector("th")?.textContent.trim();
        const val = tr.querySelector("td")?.textContent.trim();
        if (key && val) obj[key] = val;
      });
      return obj;
    }
    */
  </script>
</body>
</html>
